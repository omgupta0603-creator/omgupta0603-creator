<!doctype html>
<html><head><meta charset="utf-8">

<style>
@font-face{font-family:Inter;font-weight:900;src:url(inter.ttf)}
@font-face{font-family:Poppins;font-weight:900;src:url(poppins.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;
  background:
   radial-gradient(circle at 18% 70%, #ff4fd8aa 0, transparent 38%),
   radial-gradient(circle at 85% 25%, #2fd2ff99 0, transparent 40%),
   radial-gradient(circle at 50% 110%, #6a2cff 0, transparent 60%),
   linear-gradient(120deg,#5a1fe0 0%,#3f3ff5 45%,#1b7cff 100%);}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff26 1px,transparent 1px),linear-gradient(90deg,#ffffff26 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 95%)}
.title{position:absolute;top:-6px;left:0;right:0;text-align:center;color:#fff;
  font-family:Inter;font-weight:900;font-size:240px;letter-spacing:-10px;line-height:1;
  text-shadow:0 10px 40px #1a0a6b66}
.person{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);height:630px;
  filter:drop-shadow(0 0 18px #ffffff40) drop-shadow(0 20px 40px #0008)}
.pill{position:absolute;left:55px;top:262px;padding:14px 34px;border-radius:60px;
  background:linear-gradient(180deg,#7b4dff,#4a1fd0);border:4px solid #ffffffcc;
  box-shadow:0 0 30px #b892ff, inset 0 4px 10px #ffffff55;
  color:#fff;font-family:Poppins;font-weight:900;font-size:50px;letter-spacing:.5px}
.pill b{color:#ffef3a}
.app{position:absolute;left:110px;top:380px;width:250px;height:250px;border-radius:56px;
  background:linear-gradient(160deg,#fff,#e9e6ff);transform:rotate(-6deg);
  box-shadow:0 30px 60px #0007,0 0 0 6px #ffffff40}
.app .disc{position:absolute;inset:26px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#ffb08a,#d9693f 55%,#a8432a);
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -10px 20px #0003}
.icons{position:absolute;right:40px;top:272px;display:flex;gap:12px}
.ic{width:68px;height:68px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px #0005}
.card{position:absolute;border-radius:22px;background:#ffffffee;box-shadow:0 20px 50px #0006;padding:18px;opacity:.95}
.c1{left:-30px;top:330px;width:200px;height:260px;transform:rotate(-8deg);filter:blur(1px)}
.c2{right:-20px;top:390px;width:260px;height:200px;transform:rotate(6deg);background:#141432ee;color:#9fe;font:600 15px monospace;line-height:1.6}
.c3{right:220px;top:370px;width:220px;height:170px;transform:rotate(-4deg)}
.bubble{height:16px;border-radius:8px;background:#d8d2ff;margin:10px 0}
.bubble.o{background:#ffd2c0;width:70%;margin-left:auto}
.cta{position:absolute;right:50px;bottom:42px;padding:12px 30px;border-radius:18px;
  background:linear-gradient(180deg,#ff6a3d,#f2421b);color:#fff;
  font-family:Inter;font-weight:900;font-size:72px;letter-spacing:1px;box-shadow:0 14px 34px #0007, inset 0 3px 0 #ffffff55}
</style></head><body>
<div class="stage">
  <div class="grid"></div>
  <div class="title">Claude AI</div>

  <div class="card c1"><div class="bubble"></div><div class="bubble o"></div><div class="bubble" style="width:80%"></div><div class="bubble o"></div><div class="bubble" style="width:60%"></div><div class="bubble o" style="width:50%"></div></div>
  <div class="card c3"><div style="font:900 20px Inter;color:#4a1fd0">✦ Ask Claude</div><div class="bubble"></div><div class="bubble" style="width:75%"></div><div class="bubble o"></div></div>
  <div class="card c2">&gt; claude "build my app"<br><span style="color:#ffb08a">✔ files created</span><br><span style="color:#8af">✔ tests passing</span><br>&gt; _</div>

  <img class="person" src="person_cut.png">

  <div class="pill">PRO Tips for <b>FREE</b></div>

  <div class="app"><div class="disc">
    <svg width="130" height="130" viewBox="-50 -50 100 100"><g fill="#fff">
      <path id="r" d="M-4 -46 L4 -46 L2 -6 L-2 -6Z"/>
      <use href="#r" transform="rotate(30)"/><use href="#r" transform="rotate(60)"/><use href="#r" transform="rotate(90)"/>
      <use href="#r" transform="rotate(120)"/><use href="#r" transform="rotate(150)"/><use href="#r" transform="rotate(180)"/>
      <use href="#r" transform="rotate(210)"/><use href="#r" transform="rotate(240)"/><use href="#r" transform="rotate(270)"/>
      <use href="#r" transform="rotate(300)"/><use href="#r" transform="rotate(330)"/><circle r="9"/></g></svg>
  </div></div>

  <div class="icons">
    <div class="ic"><svg width="36" height="36" viewBox="0 0 24 24"><path fill="#7b4dff" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></div>
    <div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1b7cff" stroke-width="2.6" stroke-linecap="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></div>
    <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24"><path fill="#ff6a3d" d="M4 4h16v12H8l-4 4z"/></svg></div>
    <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" fill="#20b26b"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="2"/></svg></div>
  </div>

  <div class="cta">BEGINNER → PRO</div>
</div>
</body></html>
